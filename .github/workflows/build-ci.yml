name: build-ci
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.x
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"
          architecture: "x64"
      - name: Install Arduino
        run: bash ./.github/ci/install-arduino.sh
      - name: Install ESP8266
        run: bash ./.github/ci/install-esp8266.sh
      - name: Setup libraries
        run: bash ./.github/ci/prepare-libs.sh
      - name: Build ESP8266 arduino
        id: esp8266_1
        run: bash ./.github/ci/build-esp3d.sh esp8266 arduino
      - name: Find and copy binary
        run: cp $(find /tmp -name "esp3d.ino.bin") ./esp3d-esp8266.bin
      - name: Upload ESP8266 binary
        uses: actions/upload-artifact@v4
        with:
          name: esp3d-esp8266
          path: ./esp3d-esp8266.bin
          retention-days: 7
